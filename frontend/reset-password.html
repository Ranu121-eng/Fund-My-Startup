    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="light-page">

<!-- ================= NAVBAR ================= -->
  <nav class="navbar">
        <div class="logo">
            <h2>FUND MY</h2>
            <h2>START <span>UP</span></h2>
        </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="startup.html">Startups</a>
        <a href="investor.html">Investors</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact us</a>

    <div class="dropdown">
            <button class="login-btn">

<!-- RESET PASSWORD SECTION -->
<section class="login-section">
    <h1>Reset Password</h1>
    <p class="subtitle">
        Enter your new password below to update your account
    </p>

    <div class="login-box">
        <form id="resetForm">
            <div class="password-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password (min 6 chars)"
                    required
                >
            </div>

            <div class="password-box" style="margin-top: 15px;">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm New Password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" style="margin-top: 25px;">
                Reset Password
            </button>

            <div class="register-links">
                <div>
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </form>
    </div>
</section>

<!-- API script integration -->
<script src="js/backend-api.js"></script>
<script src="js/reset-password.js"></script>

</body>
</html>
