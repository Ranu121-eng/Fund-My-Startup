<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="light-page">

<!-- ================= NAVBAR ================= -->
  <nav class="navbar">
        <div class="logo">
            <h2>FUND MY</h2>
            <h2>START <span>UP</span></h2>
        </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="startup.html">Startups</a>
        <a href="investor.html">Investors</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact us</a>
    </div>

    <div class="dropdown">
            <button class="login-btn">
                Login/Register
            </button>
            <div class="dropdown-content">
                <a href="startup-register.html">Register as Startup</a>
                <a href="investor-register.html">Register as Investor</a>
                <a href="login.html">Login</a>
            </div>
    </div>
  </nav>

<!-- FORGOT PASSWORD SECTION -->
<section class="login-section">
    <h1>Forgot Password</h1>
    <p class="subtitle">
        Enter your registered email and select account type to receive a reset link
    </p>

    <div class="login-box">
        <form id="forgotForm">
            <input
                type="email"
                id="resetEmail"
                placeholder="Registered Email Address"
                required
            >

            <h2>Account Type</h2>
            <select id="userTypeSelect" required>
                <option value="">Select</option>
                <option value="investor">Investor</option>
                <option value="startup">Startup</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit" class="submit-btn">
                Send Reset Link
            </button>

            <div class="register-links">
                <div>
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </form>
    </div>
</section>

<!-- API script integration -->
<script src="js/backend-api.js"></script>
<script src="js/forgot-password.js"></script>

</body>
</html>
